<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Claimed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <div class="card shadow-sm border-0 p-5 bg-white rounded-3 mx-auto" style="max-width: 600px;">
            <div class="mb-3 text-success fs-1">✅</div>
            <h2 class="fw-bold text-success mb-3">Gift Successfully Claimed!</h2>
            <p class="text-muted mb-4">Congratulations! Your shipping details have been logged, and <strong>{{ gift.sender_name }}</strong> has been notified.</p>
            <a href="{{ url_for('index') }}" class="btn btn-outline-primary">Explore Smart Gifting App</a>
        </div>
    </div>
</body>
</html>
