<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f0">
    <title>{% block title %}Smart Gifting{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #18372f;
            --ink-soft: #557067;
            --leaf: #245b47;
            --leaf-deep: #174433;
            --lime: #d8ef8b;
            --coral: #c85f42;
            --paper: #f4f7f0;
            --surface: #ffffff;
            --line: #dce6dd;
            --shadow: 0 12px 32px rgba(24, 55, 47, .08);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(rgba(36, 91, 71, .08) .7px, transparent .7px);
            background-size: 18px 18px;
            font-family: "DM Sans", sans-serif;
        }

        a { color: var(--leaf); }
        a:hover { color: var(--leaf-deep); }

        .site-header {
            border-bottom: 1px solid rgba(24, 55, 47, .1);
            background: rgba(244, 247, 240, .94);
        }

        .brand-mark {
            display: inline-grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 12px;
            color: var(--ink);
            background: var(--lime);
            font-weight: 700;
        }

        .brand-name { color: var(--ink); font-weight: 700; text-decoration: none; }
        .brand-caption { color: var(--ink-soft); font-size: .78rem; }

        .eyebrow {
            color: var(--leaf);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .display-heading {
            max-width: 780px;
            color: var(--ink);
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 3.25rem;
            font-weight: 400;
            line-height: 1.08;
        }

        .text-muted { color: var(--ink-soft) !important; }

        .btn-primary {
            --bs-btn-bg: var(--leaf);
            --bs-btn-border-color: var(--leaf);
            --bs-btn-hover-bg: var(--leaf-deep);
            --bs-btn-hover-border-color: var(--leaf-deep);
            --bs-btn-active-bg: var(--leaf-deep);
            --bs-btn-active-border-color: var(--leaf-deep);
            --bs-btn-disabled-bg: var(--leaf);
            --bs-btn-disabled-border-color: var(--leaf);
            font-weight: 700;
        }

        .btn-outline-secondary {
            --bs-btn-color: var(--ink);
            --bs-btn-border-color: #b8c9bd;
            --bs-btn-hover-bg: #e5eee7;
            --bs-btn-hover-border-color: #b8c9bd;
            --bs-btn-hover-color: var(--ink);
        }

        .form-control, .form-select {
            min-height: 48px;
            border-color: #cbd9cf;
            border-radius: 10px;
            color: var(--ink);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--leaf);
            box-shadow: 0 0 0 .22rem rgba(36, 91, 71, .14);
        }

        .form-label { color: var(--ink); font-weight: 600; }
        .surface { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }

        .site-footer {
            border-top: 1px solid rgba(24, 55, 47, .1);
            color: var(--ink-soft);
            font-size: .875rem;
        }

        @media (max-width: 767.98px) {
            .display-heading { font-size: 2.35rem; }
            .site-header .container { min-height: 64px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="container d-flex align-items-center justify-content-between py-3" aria-label="Main navigation">
            <a class="d-flex align-items-center gap-2 text-decoration-none" href="{{ url_for('index') }}">
                <span class="brand-mark" aria-hidden="true">SG</span>
                <span>
                    <span class="brand-name d-block">Smart Gifting</span>
                    <span class="brand-caption d-none d-sm-block">Thoughtful gifts, made simple</span>
                </span>
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary">Find a gift</a>
        </nav>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer mt-5">
        <div class="container py-4 d-flex flex-column flex-sm-row justify-content-between gap-1">
            <span>Smart Gifting</span>
            <span>Make the moment feel personal.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
