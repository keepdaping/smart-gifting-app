<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Ready to Send</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5 text-center">
        <div class="card shadow-sm border-0 p-5 bg-white rounded-3 mx-auto" style="max-width: 600px;">
            <div class="mb-3 text-success fs-1">🎉</div>
            <h2 class="fw-bold text-primary mb-3">Gift Created Successfully!</h2>
            <p class="text-muted mb-4">Your personalized gift for <strong>{{ gift.recipient_name }}</strong> has been wrapped and is ready to share.</p>
            
            <div class="alert alert-info py-3 mb-4">
                <em>Share this unique gift link with your recipient:</em><br>
                <a href="{{ url_for('open_gift', gift_token=gift_token, _external=True) }}" target="_blank" class="fw-bold text-break">
                    {{ url_for('open_gift', gift_token=gift_token, _external=True) }}
                </a>
            </div>

            <a href="{{ url_for('index') }}" class="btn btn-outline-primary">Create Another Gift</a>
        </div>
    </div>

</body>
</html>
