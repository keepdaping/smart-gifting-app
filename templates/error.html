{% extends "base.html" %}

{% block title %}Gift Link Notice | Smart Gifting{% endblock %}

{% block head %}
    <style>
        .status-wrap { max-width: 700px; }
        .status-mark {
            display: grid;
            width: 68px;
            height: 68px;
            place-items: center;
            border-radius: 20px;
            color: #8a452f;
            background: #f8e8dc;
            font-size: 1.8rem;
            font-weight: 700;
        }
    </style>
{% endblock %}

{% block content %}
    <section class="container status-wrap py-5 py-md-6">
        <div class="surface p-4 p-md-5">
            <div class="status-mark mb-4" aria-hidden="true">!</div>
            <p class="eyebrow mb-2">Gift link update</p>
            <h1 class="display-heading mb-3">This gift needs attention.</h1>
            <p class="text-muted fs-5 mb-4">{{ message }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Return to gifting</a>
        </div>
    </section>
{% endblock %}
