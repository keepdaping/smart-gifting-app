<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Smart Gifting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 p-4 bg-white rounded-3">
                    <h2 class="fw-bold text-primary mb-3">🔒 Secure Checkout</h2>
                    <p class="text-muted mb-4">Complete your payment to generate your shareable digital gift link.</p>

                    <!-- Order Summary Box -->
                    <div class="card bg-light border-0 p-3 mb-4">
                        <h6 class="fw-bold text-dark mb-2">Order Summary</h6>
                        <div class="d-flex justify-content-between align-items-center">
                            <span>{{ gift.product.title }}</span>
                            <span class="fw-bold text-success">{{ gift.product.currency or '$' }} {{ gift.product.final_price }}</span>
                        </div>
                        <hr class="my-2">
                        <div class="small text-muted">
                            <div><strong>Recipient:</strong> {{ gift.recipient_name }}</div>
                            <div><strong>Sender:</strong> {{ gift.sender_name }}</div>
                        </div>
                    </div>

                    <!-- Mock Payment Form -->
                    <form method="POST">
                        <div class="mb-3">
                            <label for="card_name" class="form-label fw-semibold">Cardholder Name</label>
                            <input type="text" class="form-control" id="card_name" placeholder="John Doe" required value="{{ gift.sender_name }}">
                        </div>

                        <div class="mb-3">
                            <label for="card_number" class="form-label fw-semibold">Card Number</label>
                            <input type="text" class="form-control" id="card_number" placeholder="4242 •••• •••• 4242" required value="4242 4242 4242 4242">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="exp_date" class="form-label fw-semibold">Expiration Date</label>
                                <input type="text" class="form-control" id="exp_date" placeholder="MM/YY" required value="12/28">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cvc" class="form-label fw-semibold">CVC / CVV</label>
                                <input type="text" class="form-control" id="cvc" placeholder="123" required value="123">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{{ url_for('index') }}" class="text-decoration-none text-muted">Cancel</a>
                            <button type="submit" class="btn btn-success btn-lg px-5 fw-bold">Pay {{ gift.product.currency or '$' }} {{ gift.product.final_price }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
