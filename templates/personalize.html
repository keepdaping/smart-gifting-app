<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalize Your Gift</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4 bg-white rounded-3">
                    <h2 class="fw-bold text-primary mb-4">🎁 Personalize Your Gift</h2>

                    <!-- Selected Product Summary -->
                    <div class="d-flex align-items-center mb-4 p-3 bg-light rounded-3">
                        <img src="{{ product.image_url if product.image_url and product.image_url != 'nan' else 'https://via.placeholder.com/100?text=Gift' }}" 
                             alt="Product" style="width: 80px; height: 80px; object-fit: contain;" class="me-3 bg-white p-1 rounded">
                        <div>
                            <h5 class="fs-6 mb-1 text-dark">{{ product.title }}</h5>
                            <p class="text-success fw-bold mb-0">{{ product.currency or '$' }} {{ product.final_price }}</p>
                        </div>
                    </div>

                    <!-- Personalization Form -->
                    <form method="POST">
                        <div class="mb-3">
                            <label for="recipient_name" class="form-label fw-semibold">Recipient's Name</label>
                            <input type="text" class="form-control" id="recipient_name" name="recipient_name" placeholder="e.g. David" required>
                        </div>

                        <div class="mb-3">
                            <label for="sender_name" class="form-label fw-semibold">Your Name (Sender)</label>
                            <input type="text" class="form-control" id="sender_name" name="sender_name" placeholder="e.g. Sarah" required>
                        </div>

                        <div class="mb-3">
                            <label for="personal_message" class="form-label fw-semibold">Personal Message</label>
                            <textarea class="form-control" id="personal_message" name="personal_message" rows="3" placeholder="Write a thoughtful message..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="wrapping_style" class="form-label fw-semibold">Choose Digital Wrapping Theme</label>
                            <select class="form-select" id="wrapping_style" name="wrapping_style">
                                <option value="birthday">🎂 Birthday Celebration</option>
                                <option value="festive">🎄 Festive / Holiday</option>
                                <option value="love">💖 Romance & Love</option>
                                <option value="sleek">✨ Sleek & Minimalist</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="scheduled_time" class="form-label fw-semibold">Schedule Unlock Time (Optional)</label>
                            <input type="datetime-local" class="form-control" id="scheduled_time" name="scheduled_time">
                            <div class="form-text">Leave blank to allow instant unlocking.</div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Back to Search</a>
                            <button type="submit" class="btn btn-primary px-4">Continue to Gift Link</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
