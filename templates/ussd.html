<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USSD Feature-Phone Simulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .phone-frame {
            max-width: 320px;
            background: #212529;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin: auto;
        }
        .screen {
            background: #e9ecef;
            border-radius: 10px;
            padding: 15px;
            font-family: monospace;
            min-height: 200px;
            white-space: pre-line;
            font-size: 14px;
            color: #000;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">📱 Feature-Phone USSD Simulator</h2>
            <p class="text-muted">Simulate USSD gifting workflows for users without smartphones (Try typing <code>*123#</code>).</p>
        </div>

        <div class="phone-frame">
            <div class="screen mb-3 shadow-inset">
                {{ response_text if response_text else "Dial *123# to begin..." }}
            </div>

            <form method="POST">
                <input type="hidden" name="step" value="{{ step if step else 'home' }}">
                <div class="input-group mb-2">
                    <input type="text" class="form-control" name="user_input" placeholder="Enter code / option..." required autofocus>
                    <button class="btn btn-success fw-bold" type="submit">SEND</button>
                </div>
            </form>
            <div class="text-center mt-2">
                <a href="{{ url_for('ussd_simulation') }}" class="text-white-50 text-decoration-none small">Reset Session</a> | 
                <a href="{{ url_for('index') }}" class="text-white-50 text-decoration-none small">Back to App</a>
            </div>
        </div>
    </div>

</body>
</html>
